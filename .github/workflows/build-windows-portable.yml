name: Construire PATRIMONIA Windows
on:
  workflow_dispatch:
  push:
    branches:
      - refonte/patrimonia-erp-v3
    paths:
      - prototype/**
      - .github/workflows/build-windows-portable.yml
permissions:
  contents: read
jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node pour la construction
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer les composants
        working-directory: prototype
        run: npm install
      - name: Construire l'exécutable autonome
        working-directory: prototype
        run: npm run pack:win
      - name: Publier l'artefact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: patrimonia-erp-windows-portable
          path: prototype/dist/PATRIMONIA-ERP-*-Windows-Portable.exe
          if-no-files-found: error
          retention-days: 30
